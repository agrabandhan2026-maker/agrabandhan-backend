# ============================================
# AgraBandhan - Common Configuration
# ============================================
spring.application.name=agrabandhan-backend

# API versioning via context path
server.servlet.context-path=/api/v1
server.port=${PORT:8080}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ============================================
# Custom Application Properties
# ============================================
agrabandhan.jwt.secret=${JWT_SECRET:default-dev-secret-change-in-production-minimum-256-bits-long-key}
agrabandhan.jwt.access-token-expiry-ms=900000
agrabandhan.jwt.refresh-token-expiry-ms=604800000

# Cloudflare R2
agrabandhan.r2.endpoint=${R2_ENDPOINT:}
agrabandhan.r2.access-key=${R2_ACCESS_KEY:}
agrabandhan.r2.secret-key=${R2_SECRET_KEY:}
agrabandhan.r2.bucket-name=${R2_BUCKET_NAME:agrabandhan-media}
agrabandhan.r2.public-url=${R2_PUBLIC_URL:}

# CORS
agrabandhan.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
