# ============================================
# AgraBandhan - Development Profile
# ============================================

# Database (Neon free tier or local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agrabandhan_dev}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Redis (Upstash or local)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Logging
logging.level.com.agrabandhan=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Show SQL params in dev
spring.jpa.show-sql=true
